get:
    description: List outbox messages. SUPER_ADMIN sees all tenants; ADMIN sees only their own tenant. Supports filtering by status and event_type.
    operationId: listOutboxMessages
    parameters:
        - name: status
          in: query
          description: Filter by status (pending, sent, failed, dead)
          required: false
          schema:
              $ref: "../outbox-schema.yaml#/components/schemas/OutboxMessageStatus"
        - name: event_type
          in: query
          description: Filter by event type
          required: false
          schema:
              type: string
        - name: tenant_id
          in: query
          description: Filter by tenant ID (SUPER_ADMIN only)
          required: false
          schema:
              type: string
        - name: page
          in: query
          required: false
          schema:
              type: integer
              default: 1
        - name: page_size
          in: query
          required: false
          schema:
              type: integer
              default: 50
    responses:
        "200":
            description: List of outbox messages
            content:
                application/json:
                    schema:
                        type: array
                        items:
                            $ref: "../outbox-schema.yaml#/components/schemas/OutboxMessage"
        "401":
            description: Unauthorized
        "403":
            description: Forbidden
        "500":
            description: Internal server error
