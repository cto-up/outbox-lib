post:
    description: Reset a message to pending so the dispatcher will retry it immediately. Works on any status including dead. Requires ADMIN or above.
    operationId: retryOutboxMessage
    parameters:
        - name: id
          in: path
          description: Outbox message ID
          required: true
          schema:
              type: string
              format: uuid
    responses:
        "200":
            description: Message reset to pending
            content:
                application/json:
                    schema:
                        $ref: "../outbox-schema.yaml#/components/schemas/OutboxMessage"
        "401":
            description: Unauthorized
        "403":
            description: Forbidden
        "404":
            description: Not found
        "500":
            description: Internal server error
